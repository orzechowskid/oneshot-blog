name: Deploy stage to Fly.io

# This pipeline runs on a push to develop, which includes a merge. The job
# runs the browser suite against the Postgres service container defined in
# this file, using the fixed test account from tests/integration/test-account.ts.
# The job uses repository secrets for the pre-production environment only.
on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d blog" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install the Chromium browser for the browser suite
        run: npx playwright install --with-deps chromium

      - name: Run the browser suite
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://blog:blog@localhost:5432/blog

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: node scripts/deploy.ts stage --config fly.stage.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGE }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL_STAGE }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_STAGE }}
