# Production pipeline. This pipeline runs on a push to main. Branch
# protection allows only merge commits. The job uses repository secrets
# for the production environment only.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: node scripts/deploy.ts prod --config fly.prod.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL_PROD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_PROD }}
